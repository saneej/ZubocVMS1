    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var isWsError = function(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || (msg.stack ? msg.stack : ''));
          return str.includes('WebSocket closed without opened') || (str.includes('WebSocket') && str.includes('@vite/client'));
        };
        var origConsoleError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isWsError(arguments[i])) {
              return;
            }
          }
          origConsoleError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (isWsError(e.message) || (e.error && isWsError(e.error))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && isWsError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
